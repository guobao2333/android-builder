name: Auto Android Build
run-name: "${{ inputs.repository || github.repository }} • Auto Android • ${{ inputs.project_type }} • #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target Repository (owner/repo)"
        required: false
        default: ""
      branch:
        description: "Target branch, tag, or SHA"
        required: false
        default: ""
      project_type:
        description: "Project type (auto detects supported project types)"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "android", "flutter", "godot"]
      submodules:
        description: "Git submodule checkout mode"
        required: true
        default: "recursive"
        type: choice
        options: ["false", "true", "recursive"]
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options: ["debug", "release", "all"]
      module:
        description: "Android Gradle module (native Android projects)"
        required: false
        default: "app"
      build_flavor:
        description: "Android Gradle flavor filter"
        required: false
        default: ""
      flavor:
        description: "Flutter product flavor"
        required: false
        default: ""
      build_test:
        description: "Run project tests before building (Android/Flutter)"
        required: false
        default: false
        type: boolean
      android_renderer:
        description: "Flutter Android renderer; Skia is the compatibility fallback"
        required: false
        default: "skia"
        type: choice
        options: ["skia", "impeller"]

permissions:
  contents: read

jobs:
  detect:
    name: Detect project architecture
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.source.outputs.repository }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      project_type: ${{ steps.detect.outputs.project_type }}
      detected_markers: ${{ steps.detect.outputs.detected_markers }}
      detection_reason: ${{ steps.detect.outputs.detection_reason }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.branch }}
          path: source
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}
          submodules: ${{ inputs.submodules }}

      - name: Checkout project router
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .ci-workflow
          persist-credentials: false

      - name: Resolve source metadata
        id: source
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          source_sha="$(git -C source rev-parse HEAD)"
          {
            printf 'repository=%s\n' "$TARGET_REPOSITORY"
            printf 'source_sha=%s\n' "$source_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved target source: $TARGET_REPOSITORY@$source_sha"

      - name: Detect project type
        id: detect
        shell: bash
        env:
          REQUESTED_PROJECT_TYPE: ${{ inputs.project_type }}
        run: |
          set -euo pipefail
          python3 .ci-workflow/.github/scripts/project-router/detect-project.py \
            --root source \
            --requested "$REQUESTED_PROJECT_TYPE"

  android:
    name: Native Android Gradle build
    needs: detect
    if: ${{ needs.detect.outputs.project_type == 'android' }}
    uses: ./.github/workflows/android.yml
    with:
      repository: ${{ needs.detect.outputs.repository }}
      branch: ${{ needs.detect.outputs.source_sha }}
      submodules: ${{ inputs.submodules }}
      module: ${{ inputs.module }}
      build_flavor: ${{ inputs.build_flavor }}
      build_type: ${{ inputs.build_type }}
      build_test: ${{ inputs.build_test }}
      upload_release: false
    secrets: inherit

  flutter:
    name: Flutter Android build
    needs: detect
    if: ${{ needs.detect.outputs.project_type == 'flutter' }}
    uses: ./.github/workflows/flutter.yml
    with:
      repository: ${{ needs.detect.outputs.repository }}
      branch: ${{ needs.detect.outputs.source_sha }}
      submodules: ${{ inputs.submodules }}
      flutter_version: auto
      build_type: ${{ inputs.build_type }}
      flavor: ${{ inputs.flavor }}
      build_test: ${{ inputs.build_test }}
      android_renderer: ${{ inputs.android_renderer }}
    secrets: inherit

  godot:
    name: Godot Android export
    needs: detect
    if: ${{ needs.detect.outputs.project_type == 'godot' }}
    uses: ./.github/workflows/godot.yml
    with:
      repository: ${{ needs.detect.outputs.repository }}
      branch: ${{ needs.detect.outputs.source_sha }}
      submodules: ${{ inputs.submodules }}
      godot_version: auto
      export_preset: auto
      build_type: ${{ inputs.build_type }}
    secrets: inherit

  unsupported:
    name: Explain unsupported project type
    needs: detect
    if: ${{ needs.detect.outputs.project_type != 'android' && needs.detect.outputs.project_type != 'flutter' && needs.detect.outputs.project_type != 'godot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report missing adapter
        shell: bash
        env:
          PROJECT_TYPE: ${{ needs.detect.outputs.project_type }}
          DETECTED_MARKERS: ${{ needs.detect.outputs.detected_markers }}
          DETECTION_REASON: ${{ needs.detect.outputs.detection_reason }}
        run: |
          echo "::error::No Android build adapter is available for project type '$PROJECT_TYPE'."
          echo "Detected markers: $DETECTED_MARKERS"
          echo "Reason: $DETECTION_REASON"
          echo "Add or select a framework-specific adapter; the workflow will not rewrite an unknown project into an unrelated build system."
          exit 1
