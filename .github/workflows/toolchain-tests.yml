name: Toolchain Resolver Tests

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/android-ci/**'
      - '.github/scripts/godot-ci/**'
      - '.github/scripts/flutter-ci/**'
      - '.github/scripts/project-router/**'
      - '.github/actions/android-ci-prepare/**'
      - '.github/workflows/toolchain-tests.yml'
      - '.github/workflows/android.yml'
      - '.github/workflows/flutter.yml'
      - '.github/workflows/godot.yml'
      - '.github/workflows/auto.yml'
  pull_request:
    paths:
      - '.github/scripts/android-ci/**'
      - '.github/scripts/godot-ci/**'
      - '.github/scripts/flutter-ci/**'
      - '.github/scripts/project-router/**'
      - '.github/actions/android-ci-prepare/**'
      - '.github/workflows/toolchain-tests.yml'
      - '.github/workflows/android.yml'
      - '.github/workflows/flutter.yml'
      - '.github/workflows/godot.yml'
      - '.github/workflows/auto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-toolchain-resolver:
    name: Toolchain resolver regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run project resolver tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/android-ci/tests/test-resolve-toolchain.py
          python3 .github/scripts/android-ci/tests/test-resolve-ndk.py
          python3 .github/scripts/flutter-ci/tests/test-resolve-flutter.py
          python3 .github/scripts/flutter-ci/tests/test-configure-android-renderer.py
          python3 .github/scripts/flutter-ci/tests/test-prepare-env.py
          python3 .github/scripts/godot-ci/tests/test-prepare-godot.py
          python3 .github/scripts/project-router/tests/test-detect-project.py
          python3 -m compileall -q .github/scripts
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find .github -type f -name '*.sh' -print0)

      # This is an end-to-end test against Google's real 773 MB NDK preview
      # archive, not a mocked sdkmanager. It validates download, SHA-1, extract,
      # source.properties revisions, and the host LLVM binary.
      - name: Install and verify the real NDK r29-beta1 archive
        shell: bash
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          CI_HELPERS_DIR: ${{ github.workspace }}/.github/scripts/android-ci
          REQUESTED_NDK_VERSION: '29.0.13113456'
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME"
          bash "$CI_HELPERS_DIR/verify-ndk.sh"

          ndk_dir="$ANDROID_HOME/ndk/29.0.13113456"
          grep -Fxq 'Pkg.BaseRevision = 29.0.13113456' "$ndk_dir/source.properties"
          grep -Fxq 'Pkg.Revision = 29.0.13113456-beta1' "$ndk_dir/source.properties"
          test -x "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
